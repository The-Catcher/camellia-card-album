<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <style>
      .bg{fill:#F8F5EF}
      .ink{fill:#1E1E1E}
      .muted{fill:#9D9A95}
      .line{fill:none;stroke:#1E1E1E;stroke-width:.35;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#9D9A95;stroke-width:.25;stroke-linecap:round;stroke-linejoin:round}
      .wash{fill:#E8E4DC;opacity:.75}
      .label{font-family:Georgia,'Times New Roman',serif;font-size:5px;letter-spacing:0;fill:#1E1E1E}
      .small{font-family:Arial,sans-serif;font-size:3px;letter-spacing:0;fill:#54524F}
      .title{font-family:Georgia,'Times New Roman',serif;font-size:9px;letter-spacing:0;fill:#1E1E1E}
    </style>
  </defs>
  <rect class="bg" width="297" height="210"/>
  <text x="22" y="24" class="title">Camellia Sonata / 山茶奏鸣</text>
  <text x="22" y="32" class="small">Monochrome card album styleboard: classical romantic + fresh literary</text>

  <text x="22" y="52" class="label">Palette</text>
  <g transform="translate(22 60)">
    <rect width="24" height="18" fill="#F8F5EF" stroke="#1E1E1E" stroke-width=".2"/><text x="0" y="24" class="small">Ivory White</text>
    <rect x="32" width="24" height="18" fill="#FFFFFF" stroke="#1E1E1E" stroke-width=".2"/><text x="32" y="24" class="small">Paper White</text>
    <rect x="64" width="24" height="18" fill="#E8E4DC"/><text x="64" y="24" class="small">Pale Gray</text>
    <rect x="96" width="24" height="18" fill="#9D9A95"/><text x="96" y="24" class="small">Mid Gray</text>
    <rect x="128" width="24" height="18" fill="#1E1E1E"/><text x="128" y="24" class="small">Charcoal</text>
    <rect x="160" width="24" height="18" fill="#050505"/><text x="160" y="24" class="small">Soft Black</text>
  </g>

  <text x="22" y="106" class="label">Linework</text>
  <g transform="translate(34 128)">
    <ellipse class="wash" cx="0" cy="2" rx="20" ry="9"/>
    <path class="line" d="M0 0 C-12 -10 -18 -2 -10 7 C-3 14 4 10 0 0Z"/>
    <path class="line" d="M0 0 C8 -13 18 -8 16 4 C14 15 4 12 0 0Z"/>
    <path class="line" d="M0 0 C-2 -16 10 -20 16 -9 C22 2 9 5 0 0Z"/>
    <path class="soft" d="M0 0 C-5 -5 -4 -11 1 -14"/>
    <path class="soft" d="M0 0 C6 -5 9 -8 14 -8"/>
    <circle cx="-10" cy="4" r=".35" fill="#9D9A95"/><circle cx="-6" cy="8" r=".3" fill="#9D9A95"/><circle cx="8" cy="7" r=".3" fill="#9D9A95"/>
  </g>

  <text x="112" y="106" class="label">Typography</text>
  <text x="112" y="125" class="title">Camellia Sonata</text>
  <text x="112" y="134" class="label">Prelude</text>
  <text x="112" y="142" class="small">No. 01</text>

  <text x="202" y="106" class="label">Composition</text>
  <g transform="translate(202 118)">
    <rect width="24" height="34" fill="#FFFFFF" stroke="#9D9A95" stroke-width=".2"/>
    <path class="soft" d="M2 28 H22"/><rect x="4" y="28" width="3" height="6" fill="#1E1E1E"/><rect x="11" y="28" width="3" height="6" fill="#1E1E1E"/>
    <path class="line" d="M18 8 C9 2 4 10 10 17 C15 23 23 17 18 8Z"/>
    <rect x="34" width="24" height="34" fill="#FFFFFF" stroke="#9D9A95" stroke-width=".2"/>
    <path class="soft" d="M38 4 L54 30 M42 4 L58 30 M46 4 L62 30"/>
    <path class="line" d="M46 12 C38 6 34 13 39 19 C44 25 51 20 46 12Z"/>
    <rect x="68" width="24" height="34" fill="#FFFFFF" stroke="#9D9A95" stroke-width=".2"/>
    <path class="soft" d="M72 7 C83 12 86 22 88 31"/>
    <path class="line" d="M78 11 C70 5 66 12 71 18 C76 24 84 19 78 11Z"/>
  </g>

  <text x="22" y="178" class="label">Material Direction</text>
  <text x="22" y="187" class="small">Matte art paper, fine-textured paper, or pearl white stock. Spot UV on petal highlights or piano-key reflections.</text>
</svg>
