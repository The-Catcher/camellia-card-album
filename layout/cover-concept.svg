<svg xmlns="http://www.w3.org/2000/svg" width="76mm" height="106mm" viewBox="0 0 76 106">
  <defs>
    <style>
      .paper{fill:#F8F5EF}
      .trim{fill:none;stroke:#9D9A95;stroke-width:.2;stroke-dasharray:1.2 1.2}
      .safe{fill:none;stroke:#E8E4DC;stroke-width:.25}
      .line{fill:none;stroke:#1E1E1E;stroke-width:.38;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#9D9A95;stroke-width:.25;stroke-linecap:round;stroke-linejoin:round}
      .wash{fill:#E8E4DC;opacity:.72}
      .black{fill:#1E1E1E}
      .title{font-family:Georgia,'Times New Roman',serif;font-size:5.4px;letter-spacing:0;fill:#1E1E1E}
      .cn{font-family:'Microsoft YaHei',SimSun,serif;font-size:3.2px;letter-spacing:0;fill:#1E1E1E}
      .mark{font-family:Arial,sans-serif;font-size:2px;letter-spacing:0;fill:#9D9A95}
