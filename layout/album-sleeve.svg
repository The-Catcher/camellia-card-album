<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="116mm" viewBox="0 0 170 116">
  <defs>
    <style>
      .paper{fill:#F8F5EF}
      .panel{fill:none;stroke:#9D9A95;stroke-width:.25;stroke-dasharray:1.5 1.5}
      .fold{fill:none;stroke:#D8D5CF;stroke-width:.25;stroke-dasharray:.8 1.2}
      .line{fill:none;stroke:#1E1E1E;stroke-width:.36;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#9D9A95;stroke-width:.22;stroke-linecap:round;stroke-linejoin:round}
      .wash{fill:#E8E4DC;opacity:.6}
      .black{fill:#1E1E1E}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:7px;letter-spacing:0;fill:#1E1E1E}
      .cn{font-family:"Microsoft YaHei",SimSun,serif;font-size:4px;letter-spacing:0;fill:#1E1E1E}
      .small{font-family:Arial,sans-serif;font-size:2.4px;letter-spacing:0;fill:#9D9A95}
    </style>
  </defs>
  <rect class="paper" width="170" height="116"/>
  <rect class="panel" x="8" y="8" width="72" height="100"/>
  <rect class="panel" x="90" y="8" width="72" height="100"/>
  <line class="fold" x1="85" y1="8" x2="85" y2="108"/>
  <text x="104" y="33" class="title">Camellia Sonata</text>
  <text x="104" y="42" class="cn">山茶奏鸣</text>
  <text x="104" y="92" class="small">Six monochrome collectible cards</text>
  <g transform="translate(18 74) rotate(-8)">
    <rect x="0" y="10" width="58" height="14" fill="#FFFFFF" stroke="#9D9A95" stroke-width=".2"/>
    <rect class="black" x="8" y="10" width="3" height="8"/>
    <rect class="black" x="16" y="10" width="3" height="8"/>
    <rect class="black" x="29" y="10" width="3" height="8"/>
    <rect class="black" x="37" y="10" width="3" height="8"/>
    <rect class="black" x="45" y="10" width="3" height="8"/>
    <path class="soft" d="M0 17 H58 M8 10 V24 M16 10 V24 M24 10 V24 M32 10 V24 M40 10 V24 M48 10 V24"/>
  </g>
  <g transform="translate(120 69) rotate(-15)">
    <ellipse class="wash" cx="0" cy="2" rx="24" ry="13"/>
    <path class="line" d="M0 0 C-14 -12 -23 -2 -14 10 C-5 22 8 13 0 0Z"/>
    <path class="line" d="M0 0 C9 -16 24 -9 22 7 C20 21 6 14 0 0Z"/>
    <path class="line" d="M0 0 C-3 -20 13 -26 22 -13 C31 -1 11 5 0 0Z"/>
    <path class="soft" d="M0 0 C-6 -7 -4 -13 3 -18"/>
    <path class="soft" d="M0 0 C8 -7 14 -9 21 -8"/>
  </g>
  <text x="13" y="20" class="small">BACK PANEL</text>
  <text x="95" y="20" class="small">FRONT PANEL</text>
