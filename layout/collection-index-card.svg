<svg xmlns="http://www.w3.org/2000/svg" width="76mm" height="106mm" viewBox="0 0 76 106">
  <defs>
    <style>
      .paper{fill:#FFFFFF}
      .trim{fill:none;stroke:#9D9A95;stroke-width:.2;stroke-dasharray:1.2 1.2}
      .safe{fill:none;stroke:#E8E4DC;stroke-width:.25}
      .line{fill:none;stroke:#1E1E1E;stroke-width:.28;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#9D9A95;stroke-width:.18;stroke-linecap:round;stroke-linejoin:round}
      .title{font-family:Georgia,"Times New Roman",serif;font-size:4.4px;letter-spacing:0;fill:#1E1E1E}
      .item{font-family:Georgia,"Times New Roman",serif;font-size:2.9px;letter-spacing:0;fill:#1E1E1E}
      .num{font-family:Arial,sans-serif;font-size:1.8px;letter-spacing:0;fill:#9D9A95}
    </style>
  </defs>
  <rect class="paper" width="76" height="106"/>
  <rect class="trim" x="3" y="3" width="70" height="100"/>
  <rect class="safe" x="8" y="8" width="60" height="90"/>
  <text x="16" y="21" class="title">Camellia Sonata</text>
  <text x="16" y="27" class="num">Collector Index / 山茶奏鸣系列索引</text>
  <path class="soft" d="M16 34 H60"/>
  <g transform="translate(16 43)">
    <text x="0" y="0" class="num">No. 01</text><text x="19" y="0" class="item">Prelude</text>
    <text x="0" y="8" class="num">No. 02</text><text x="19" y="8" class="item">Adagio</text>
    <text x="0" y="16" class="num">No. 03</text><text x="19" y="16" class="item">Nocturne</text>
    <text x="0" y="24" class="num">No. 04</text><text x="19" y="24" class="item">Waltz</text>
    <text x="0" y="32" class="num">No. 05</text><text x="19" y="32" class="item">Echo</text>
    <text x="0" y="40" class="num">No. 06</text><text x="19" y="40" class="item">Finale</text>
  </g>
  <g transform="translate(56 76) rotate(-14) scale(.52)">
    <path class="line" d="M0 0 C-14 -12 -23 -2 -14 10 C-5 22 8 13 0 0Z"/>
    <path class="line" d="M0 0 C9 -16 24 -9 22 7 C20 21 6 14 0 0Z"/>
    <path class="line" d="M0 0 C-3 -20 13 -26 22 -13 C31 -1 11 5 0 0Z"/>
  </g>
  <path class="soft" d="M16 89 H60"/>
  <text x="16" y="95" class="num">Black-and-white camellia + piano theme</text>
</svg>
